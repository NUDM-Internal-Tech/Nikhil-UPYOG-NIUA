<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <!-- Static assets in public/ are served at root, base path handled by Vite -->
    <link rel="icon" href="/upyog-ui/browser-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#00bcd1"/>
    <!-- Runtime config (STATE_LEVEL_TENANT_ID, etc.). Without it, many MDMS/API calls used undefined tenant. -->
    <script src="https://upyog-finance.s3.ap-south-1.amazonaws.com/globalConfigs.js"></script>
    <script src="https://pgtest.atomtech.in/staticdata/ots/js/atomcheckout.js"></script>
    <title>UPYOG</title>
    <style>
      /* ===== Global page reset to remove default body/root background ===== */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        background-color: #ffffff !important;
      }
      #root {
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
      }

      /* ===== Full-width Top Government Header Bar ===== */
      .login-page-wrapper {
        display: flex !important;
        flex-direction: column !important;
        min-height: 100vh !important;
        width: 100% !important;
        margin: 0 !important;
        padding-top: 72px !important;
        box-sizing: border-box !important;
      }
      .login-top-govt-header {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        background: linear-gradient(135deg, #dee0f2 0%, #ced0e8 100%) !important; /* Exact match with new image sky top */
        border-bottom: 1.5px solid rgba(0,0,0,0.06) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        padding: 8px 32px !important;
        box-sizing: border-box !important;
        z-index: 9999 !important;
        height: 72px !important;
        flex-wrap: nowrap !important;
        overflow: hidden !important;
      }
      .top-govt-brand {
        display: flex !important;
        align-items: center !important;
      }
      .top-govt-upyog-logo {
        height: 52px !important;
        width: auto !important;
        object-fit: contain !important;
      }
      .top-govt-center {
        display: flex !important;
        align-items: center !important;
        gap: 14px !important;
      }
      .top-govt-seal {
        height: 52px !important;
        width: auto !important;
        object-fit: contain !important;
      }
      .top-govt-state-name {
        display: flex !important;
        flex-direction: column !important;
        gap: 2px !important;
      }
      .top-govt-hindi {
        font-size: 18px !important;
        font-weight: 700 !important;
        color: #0b0b0b !important; /* Dark text for contrast against light pink */
        font-family: sans-serif !important;
      }
      .top-govt-english {
        font-size: 13px !important;
        font-weight: 500 !important;
        color: #444444 !important;
      }
      .top-govt-leaders {
        display: flex !important;
        align-items: center !important;
        gap: 24px !important;
        flex-shrink: 0 !important;
        white-space: nowrap !important;
      }
      .top-govt-leader-item {
        display: flex !important;
        align-items: center !important;
        gap: 10px !important;
        flex-shrink: 0 !important;
      }
      .top-govt-leader-photo {
        width: 52px !important;
        height: 52px !important;
        border-radius: 50% !important;
        object-fit: cover !important;
        object-position: top !important;
        border: 2px solid rgba(0,0,0,0.15) !important;
        background: rgba(255,255,255,0.5) !important;
      }
      .top-govt-leader-info {
        display: flex !important;
        flex-direction: column !important;
        gap: 1px !important;
      }
      .top-govt-leader-name {
        font-size: 13px !important;
        font-weight: 700 !important;
        color: #0b0b0b !important;
        font-family: sans-serif !important;
      }
      .top-govt-leader-title {
        font-size: 11px !important;
        color: #444444 !important;
        font-weight: 500 !important;
      }
      .top-govt-leader-subtitle {
        font-size: 10px !important;
        color: #666666 !important;
      }

      /* Hide text info for CM/PM on smaller screens to prevent header overflow */
      @media screen and (max-width: 1150px) {
        .top-govt-leader-info {
          display: none !important;
        }
        .top-govt-leaders {
          gap: 12px !important;
        }
        .top-govt-center {
          gap: 8px !important;
        }
        .top-govt-english {
          display: none !important;
        }
      }
      @media screen and (max-width: 900px) {
        .top-govt-leaders {
          display: none !important;
        }
      }
      .top-govt-leader-avatar {
        width: 52px !important;
        height: 52px !important;
        border-radius: 50% !important;
        background: rgba(255,255,255,0.25) !important;
        border: 2.5px solid rgba(255,255,255,0.8) !important;
        color: #ffffff !important;
        font-size: 14px !important;
        font-weight: 700 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-shrink: 0 !important;
        font-family: sans-serif !important;
        letter-spacing: 0.5px !important;
      }
      /* ===== Remove outer citizen layout padding/margins on login view ===== */
      .citizen .main:has(.login-page-wrapper),
      .citizen .citizen-home-container:has(.login-page-wrapper),
      .citizen:has(.login-page-wrapper) .main,
      .citizen .main:has(.login-split-container),
      .citizen .citizen-home-container:has(.login-split-container),
      .citizen:has(.login-split-container) .main {
        padding: 0 !important;
        padding-top: 0 !important;
        margin: 0 !important;
        margin-top: 0 !important;
        margin-bottom: 0 !important;
        width: 100% !important;
        min-height: 100vh !important;
      }

      /* Reduce split container height to account for header */
      .login-split-container {
        height: calc(100vh - 72px) !important;
        min-height: calc(100vh - 72px) !important;
        max-height: calc(100vh - 72px) !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        position: relative !important;
      }

      /* Force background image to fill screen height fully behind the header */
      .login-bg-picture {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 58% !important;
        height: 100% !important;
        z-index: 1 !important;
      }

      /* Desktop override: limit background container width and show full image ratio without cropping */
      @media screen and (min-width: 901px) {
        .login-bg-picture {
          width: 58% !important;
          background: #ffffff !important; /* Solid white background to ensure transparent image details remain bright and correct */
          height: 100% !important;
          top: 0 !important;
        }
        .login-bg-img {
          object-fit: cover !important;
          object-position: center bottom !important;
          filter: none !important; /* Forces browser/extensions not to darken the image */
          mix-blend-mode: normal !important; /* Prevents color blending filters */
          opacity: 1 !important; /* Ensures full brightness */
        }
        .login-left-section {
          justify-content: flex-start !important;
          padding-top: 40px !important;
          padding-left: 64px !important;
          padding-right: 64px !important;
          box-sizing: border-box !important;
          min-height: calc(100vh - 72px) !important;
          height: 100% !important;
        }
        .login-right-section {
          width: 42% !important;
          min-height: calc(100vh - 72px) !important;
          height: 100% !important;
          background: #ffffff !important;
          padding: 40px 48px !important;
          box-sizing: border-box !important;
          position: relative !important;
        }
        .login-top-header-controls {
          position: absolute !important;
          top: 24px !important;
          right: 36px !important;
        }
      }

      /* Official Upyog logo image styling */
      .upyog-logo-header-official {
        display: flex !important;
        align-items: center !important;
        justify-content: flex-start !important;
        margin-bottom: 24px !important;
      }
      .upyog-official-logo-img {
        height: 64px !important;
        width: auto !important;
        object-fit: contain !important;
      }
      .login-heading {
        color: #0b0b0b !important;
      }
      .feature-list-row-item h4 {
        color: #0b0b0b !important;
      }
      .feature-row-icon-box {
        background: rgba(0, 0, 0, 0.05) !important;
        color: #0b0b0b !important;
      }

      /* Rich black text overrides instead of purple in the right section */
      .login-mockup-solid-content h2,
      .login-right-section h2 {
        color: #0b0b0b !important;
      }
      .mockup-mobile-icon-badge {
        background: rgba(0, 0, 0, 0.05) !important;
        color: #0b0b0b !important;
      }
      .trust-column-icon {
        color: #555555 !important;
      }
      .trust-column-text strong {
        color: #0b0b0b !important;
      }
      .login-mockup-copyright {
        text-align: left !important;
        margin-left: 0 !important;
        width: 100% !important;
      }

      /* Hide Back Button link */
      .login-right-section .back-btn2 {
        display: none !important;
      }

      /* Centering and sizing next/submit buttons */
      .login-right-section .submit-bar, 
      .login-right-section .submit-bar-disabled {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        text-align: center !important;
        align-self: stretch !important;
      }
      .login-right-section .submit-bar header, 
      .login-right-section .submit-bar-disabled header {
        text-align: center !important;
        width: 100% !important;
        margin: 0 auto !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        height: auto !important;
        line-height: normal !important;
      }
      /* Card containers inside right section must be full width */
      .login-right-section .card,
      .login-right-section .employeeCard {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
      }
      .login-right-section form {
        width: 100% !important;
      }

      /* Force full width on DigiLocker column wrapper */
      .login-right-section .col,
      .login-right-section div.col,
      .login-right-section div.col-md-4,
      .login-right-section .col.col-md-4,
      .login-right-section .col-md-4, 
      .login-right-section div[style*="width:40%"], 
      .login-right-section div[style*="width: 40%"] {
        width: 100% !important;
        max-width: 100% !important;
        flex: 0 0 100% !important;
        order: 4 !important;
        margin-top: 16px !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
      }

      /* Enforce flex ordering to swap Next and DigiLocker buttons */
      .login-right-section .card, 
      .login-right-section .employeeCard, 
      .login-right-section form {
        display: flex !important;
        flex-direction: column !important;
      }

      .login-right-section .card > *, 
      .login-right-section .employeeCard > *, 
      .login-right-section form > * {
        order: 5 !important;
      }

      .login-right-section .card-label, 
      .login-right-section label, 
      .login-right-section .label-container, 
      .login-right-section .field-container, 
      .login-right-section .field, 
      .login-right-section div:has(input[type="text"]), 
      .login-right-section .label-field-pair {
        order: 1 !important;
      }

      .login-right-section .citizen-consent-form, 
      .login-right-section div:has(input[type="checkbox"]), 
      .login-right-section .CitizenConsentForm {
        order: 2 !important;
      }

      .login-right-section .submit-bar, 
      .login-right-section .submit-bar-disabled {
        order: 3 !important;
        margin-top: 16px !important;
      }

      /* OR Divider line inside DigiLocker column */
      .login-right-section div.col-md-4:before,
      .login-right-section div[style*="width: 40%"]:before {
        content: "OR" !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 100% !important;
        font-size: 11px !important;
        font-weight: 700 !important;
        color: #707070 !important;
        margin-bottom: 16px !important;
        margin-top: 8px !important;
        position: relative !important;
        
        /* Divider lines */
        background: linear-gradient(to right, rgba(0,0,0,0.1), rgba(0,0,0,0.1)) no-repeat center left,
                    linear-gradient(to right, rgba(0,0,0,0.1), rgba(0,0,0,0.1)) no-repeat center right;
        background-size: 44% 1px, 44% 1px;
      }

      .login-right-section .digilocker-btn {
        width: 100% !important;
        max-width: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        text-align: center !important;
        background: #ffffff !important;
        border: 1.5px solid #5a1166 !important;
        border-radius: 10px !important;
        height: 48px !important;
        color: #5a1166 !important;
        font-weight: 700 !important;
        font-size: 14px !important;
        gap: 12px !important;
        margin-top: 0px !important;
        box-sizing: border-box !important;
      }

      .login-right-section .digilocker-btn img {
        position: static !important;
        left: auto !important;
        transform: none !important;
        width: 24px !important;
        height: 24px !important;
        object-fit: contain !important;
        margin: 0 8px 0 0 !important;
      }

      /* Force mockup content blocks to order correctly */
      .login-mockup-solid-content {
        display: flex !important;
        flex-direction: column !important;
      }
      .login-mockup-solid-content .mockup-card-header {
        order: 1 !important;
        align-items: flex-start !important;
        text-align: left !important;
        width: 100% !important;
      }
      .login-mockup-solid-content .mockup-card-header h2,
      .login-mockup-solid-content .mockup-card-header p {
        text-align: left !important;
      }
      .login-mockup-solid-content .mockup-card-body {
        order: 2 !important;
      }
      .login-mockup-solid-content .solid-panel-trust-row {
        order: 3 !important;
      }
      .login-mockup-solid-content .login-mockup-copyright {
        order: 4 !important;
      }

      /* All text in the right login panel should be black */
      .login-right-section,
      .login-right-section p,
      .login-right-section span,
      .login-right-section label,
      .login-right-section .card-label,
      .login-right-section .mobile-number-label,
      .login-right-section input,
      .login-right-section .citizen-consent-form,
      .login-right-section .CitizenConsentForm {
        color: #0b0b0b !important;
      }

      /* Submit (Get OTP) and DigiLocker buttons: force center alignment within card body */
      .login-mockup-solid-content .mockup-card-body .submit-bar,
      .login-mockup-solid-content .mockup-card-body .submit-bar-disabled {
        margin-left: auto !important;
        margin-right: auto !important;
        align-self: center !important;
      }
      .login-right-section .col,
      .login-right-section div.col,
      .login-right-section div.col-md-4 {
        align-items: center !important;
      }

      /* Fix OTP input squares: ensure text is centered and not cut off at the bottom */
      .login-right-section .input-otp-wrap input {
        height: 52px !important;
        width: 52px !important;
        font-size: 22px !important;
        font-weight: 600 !important;
        padding: 0 !important;
        line-height: 52px !important;
        text-align: center !important;
        box-sizing: border-box !important;
      }

      /* Fix Citizen OTP Page visual layout: push inputs to top and submit button to bottom */
      .login-right-section .input-otp-wrap {
        order: 1 !important;
      }
      .login-right-section .input-otp-wrap ~ .submit-bar,
      .login-right-section .input-otp-wrap ~ .submit-bar-disabled {
        order: 5 !important;
        margin-top: 24px !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      Vite requires the entry script here in index.html as type="module"
      CRA injected this automatically — Vite requires it explicitly
    -->
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
